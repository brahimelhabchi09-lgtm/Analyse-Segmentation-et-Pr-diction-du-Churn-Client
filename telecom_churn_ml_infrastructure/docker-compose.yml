services:

  postgres:
    image: postgres:16
    container_name: telecom_churn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telecom_ml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: telecom_churn_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
    ports:
      - "${MLFLOW_PORT}:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
      - ./mlruns:/mlruns
    networks:
      - telecom_ml
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root /mlartifacts

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom_churn_streamlit
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${STREAMLIT_PORT}:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./src:/app/src
      - ./app:/app/app
    networks:
      - telecom_ml

networks:
  telecom_ml:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:
